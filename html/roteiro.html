<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadMap - Detalhes do Roteiro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
    body { font-family: "Inter", sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%); }
    .fade-in { animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="gradient-bg text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-6">
      <div class="flex justify-between items-center">
        <a href="dashboard.html" class="flex items-center gap-3 hover:opacity-80">
          <i class="fa-solid fa-map text-3xl"></i>
          <h1 class="text-2xl font-bold">RoadMap</h1>
        </a>
        <button onclick="window.location.href = 'dashboard.html'" class="bg-white/20 hover:bg-white/30 px-5 py-2 rounded-xl flex items-center gap-2">
          <i class="fa-solid fa-arrow-left"></i> Voltar
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-12">
    <div id="roteiro-content" class="fade-in hidden">
      <div class="bg-white rounded-t-[3rem] p-8 sm:p-12 shadow-sm border-x border-t border-gray-100">
        <div id="tipo-badge" class="mb-6"></div>
        <h2 id="det-titulo" class="text-4xl font-bold text-gray-900"></h2>
        <div class="flex flex-wrap gap-6 mt-6 text-gray-600">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-location-dot text-teal-600"></i>
            <span id="det-destino"></span>
          </div>
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-calendar-alt text-teal-600"></i>
            <span id="det-datas"></span>
          </div>
        </div>
      </div>

      <div class="bg-white p-8 sm:p-12 border-x border-gray-100">
        <div class="flex gap-4 mb-8">
          <button onclick="adicionarAtividade()" class="flex-1 bg-teal-600 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-teal-700">
            <i class="fa-solid fa-plus"></i> Nova Atividade
          </button>
          <button onclick="mostrarChecklist()" class="flex-1 bg-amber-500 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 hover:bg-amber-600">
            <i class="fa-solid fa-suitcase"></i> Checklist de Mala
          </button>
        </div>

        <h3 class="text-xl font-bold mb-6">Atividades do Roteiro</h3>
        <div id="lista-atividades" class="space-y-4"></div>
      </div>
    </div>

    <div id="error-state" class="hidden text-center py-20">
      <i class="fa-solid fa-triangle-exclamation text-6xl text-red-500 mb-6"></i>
      <h3 class="text-2xl font-bold">Roteiro não encontrado</h3>
    </div>
  </main>

  <script>
    let roteiroAtual = null;
    let atividades = [];

    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const id = parseInt(urlParams.get("id"));

      if (!id) return mostrarErro();

      const roteiros = JSON.parse(localStorage.getItem("roadmap_roteiros") || "[]");
      roteiroAtual = roteiros.find(r => r.id === id);

      if (roteiroAtual) {
        renderizarBasico();
        atividades = roteiroAtual.atividades || [];
        renderAtividades();
      } else {
        mostrarErro();
      }
    });

    function renderizarBasico() {
      document.getElementById("roteiro-content").classList.remove("hidden");
      document.getElementById("det-titulo").textContent = roteiroAtual.titulo;
      document.getElementById("det-destino").textContent = roteiroAtual.destino;
      document.getElementById("det-datas").textContent = 
        `${new Date(roteiroAtual.dataInicio).toLocaleDateString('pt-BR')} — ${new Date(roteiroAtual.dataFim).toLocaleDateString('pt-BR')}`;

      const badge = document.getElementById("tipo-badge");
      badge.innerHTML = roteiroAtual.tipo === "smart" 
        ? `<span class="bg-teal-600 text-white px-4 py-1.5 rounded-full text-xs font-bold">IA</span>`
        : `<span class="bg-gray-200 text-gray-700 px-4 py-1.5 rounded-full text-xs font-bold">Manual</span>`;
    }

    function adicionarAtividade() {
      const data = prompt("Data (ex: 2026-06-05):");
      if (!data) return;
      const hora = prompt("Hora (ex: 14:30):");
      if (!hora) return;
      const descricao = prompt("Descrição / Local:");
      if (!descricao) return;

      atividades.push({ data, hora, descricao });
      salvarAlteracoes();
      renderAtividades();
    }

    function renderAtividades() {
      const container = document.getElementById("lista-atividades");
      
      if (!atividades || atividades.length === 0) {
        container.innerHTML = `<p class="text-gray-500 py-8 text-center">Nenhuma atividade adicionada ainda.</p>`;
        return;
      }

      container.innerHTML = atividades.map((at, i) => {
        const descricao = at.descricao || at || 'Atividade sem descrição';
        const data = at.data || '';
        const hora = at.hora || '';
        
        return `
          <div class="bg-gray-50 p-5 rounded-3xl border flex justify-between items-center">
            <div>
              <p class="font-medium">${descricao}</p>
              <p class="text-sm text-teal-600">${data} ${hora ? '• ' + hora : ''}</p>
            </div>
            <button onclick="removerAtividade(${i})" class="text-red-500 hover:text-red-700">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    function removerAtividade(index) {
      if (confirm("Remover?")) {
        atividades.splice(index, 1);
        salvarAlteracoes();
        renderAtividades();
      }
    }

    function salvarAlteracoes() {
      const roteiros = JSON.parse(localStorage.getItem("roadmap_roteiros") || "[]");
      const index = roteiros.findIndex(r => r.id === roteiroAtual.id);
      if (index !== -1) {
        roteiros[index].atividades = atividades;
        localStorage.setItem("roadmap_roteiros", JSON.stringify(roteiros));
      }
    }

    function mostrarChecklist() {
      const estacao = (roteiroAtual.estacao || "Geral").toLowerCase();
      let html = `<h4 class="font-bold text-lg mb-4">Checklist de Mala - ${roteiroAtual.estacao || "Geral"}</h4>`;

      if (estacao.includes("verão")) {
        html += `
          <ul class="space-y-3 text-gray-700">
            <li>✅ Roupas leves, shorts e camisetas</li>
            <li>✅ Protetor solar, óculos e chapéu</li>
            <li>✅ Roupa de banho e chinelo</li>
            <li>✅ Garrafa de água reutilizável</li>
            <li>✅ Repelente de insetos</li>
          </ul>`;
      } else if (estacao.includes("inverno")) {
        html += `
          <ul class="space-y-3 text-gray-700">
            <li>✅ Casaco pesado / Jaqueta térmica</li>
            <li>✅ Botas impermeáveis</li>
            <li>✅ Luvas, cachecol e gorro</li>
            <li>✅ Roupas térmicas</li>
            <li>✅ Medicamentos para frio</li>
          </ul>`;
      } else if (estacao.includes("primavera")) {
        html += `
          <ul class="space-y-3 text-gray-700">
            <li>✅ Roupas em camadas</li>
            <li>✅ Jaqueta leve impermeável</li>
            <li>✅ Tênis confortável</li>
            <li>✅ Protetor solar</li>
            <li>✅ Guarda-chuva pequeno</li>
          </ul>`;
      } else if (estacao.includes("outono")) {
        html += `
          <ul class="space-y-3 text-gray-700">
            <li>✅ Roupas em camadas</li>
            <li>✅ Jaqueta leve</li>
            <li>✅ Botas ou tênis confortável</li>
            <li>✅ Lenço ou cachecol</li>
            <li>✅ Guarda-chuva</li>
          </ul>`;
      } else {
        html += `
          <ul class="space-y-3 text-gray-700">
            <li>✅ Roupas versáteis</li>
            <li>✅ Jaqueta leve</li>
            <li>✅ Tênis confortável</li>
            <li>✅ Adaptador de tomada</li>
            <li>✅ Documentos e carregadores</li>
          </ul>`;
      }

      document.getElementById("lista-atividades").innerHTML = html;
    }

    function mostrarErro() {
      document.getElementById("error-state").classList.remove("hidden");
    }
  </script>
</body>
</html>
