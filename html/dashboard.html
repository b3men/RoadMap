<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadMap - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
    body { font-family: "Inter", sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="gradient-bg text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-map text-3xl"></i>
        <h1 class="text-3xl font-bold">RoadMap</h1>
      </div>
      <button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-5 py-2 rounded-xl flex items-center gap-2">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10">
    <div class="flex justify-between items-center mb-10">
      <h2 class="text-4xl font-bold text-gray-800">Meus Roteiros</h2>
      <button onclick="openNewRoteiroModal()" class="gradient-bg text-white px-6 py-3 rounded-2xl font-semibold flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Novo Roteiro
      </button>
    </div>

    <div id="roteiros-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- Modal -->
  <div id="new-roteiro-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 w-full max-w-lg">
      <h3 class="text-2xl font-bold mb-6">Criar Novo Roteiro</h3>

      <div class="flex border-b mb-6">
        <button onclick="switchTab('sugerido')" id="tab-sugerido" class="flex-1 py-3 font-medium border-b-2 border-teal-600 text-teal-600">Sugestões</button>
        <button onclick="switchTab('manual')" id="tab-manual" class="flex-1 py-3 font-medium text-gray-500">Manual</button>
      </div>

      <!-- Sugerido -->
      <form id="form-sugerido" onsubmit="criarRoteiroSugerido(event)">
        <div class="space-y-5">
          <div>
            <label class="block text-sm mb-2">Escolha um Destino Sugerido</label>
            <select id="sugerido-opcao" required class="w-full p-4 border border-gray-300 rounded-2xl">
              <option value="">Selecione...</option>
              <option value="Europa-Primavera">Europa - Primavera (Paris, Itália, Espanha)</option>
              <option value="América do Sul-Verão">América do Sul - Verão (Rio, Nordeste)</option>
              <option value="Ásia-Primavera">Ásia - Primavera (Japão Sakura)</option>
              <option value="África-Primavera">África - Primavera (Quênia Safári)</option>
              <option value="América do Norte-Outono">América do Norte - Outono (Canadá)</option>
              <option value="Oceania-Verão">Oceania - Verão (Austrália)</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <input id="sugerido-inicio" type="date" required class="w-full p-4 border border-gray-300 rounded-2xl">
            <input id="sugerido-fim" type="date" required class="w-full p-4 border border-gray-300 rounded-2xl">
          </div>
          <button type="submit" class="w-full gradient-bg text-white py-4 rounded-2xl font-bold">Criar Roteiro Sugerido</button>
        </div>
      </form>

      <!-- Manual -->
      <form id="form-manual" onsubmit="criarRoteiroManual(event)" class="hidden space-y-5">
        <input id="man-titulo" type="text" placeholder="Título do Roteiro" required class="w-full p-4 border border-gray-300 rounded-2xl">
        <input id="man-destino" type="text" placeholder="Destino" required class="w-full p-4 border border-gray-300 rounded-2xl">
        <div class="grid grid-cols-2 gap-4">
          <input id="man-inicio" type="date" required class="w-full p-4 border border-gray-300 rounded-2xl">
          <input id="man-fim" type="date" required class="w-full p-4 border border-gray-300 rounded-2xl">
        </div>
        <button type="submit" class="w-full gradient-bg text-white py-4 rounded-2xl font-bold">Criar Manualmente</button>
      </form>
    </div>
  </div>

  <script>
    let roteiros = JSON.parse(localStorage.getItem("roadmap_roteiros")) || [];

    function salvarRoteiros() {
      localStorage.setItem("roadmap_roteiros", JSON.stringify(roteiros));
    }

    function renderDashboard() {
      const container = document.getElementById("roteiros-container");
      container.innerHTML = roteiros.map(r => `
        <div onclick="verRoteiro(${r.id})" class="bg-white rounded-3xl p-6 border hover:border-teal-300 cursor-pointer">
          <h3 class="font-bold text-xl">${r.titulo}</h3>
          <p class="text-teal-600 mt-1">${r.destino}</p>
          <p class="text-sm text-gray-500 mt-4">${r.dataInicio} — ${r.dataFim}</p>
        </div>
      `).join('');
    }

    function openNewRoteiroModal() {
      document.getElementById("new-roteiro-modal").classList.remove("hidden");
      switchTab('sugerido');
    }

    function switchTab(tab) {
      const tabSugerido = document.getElementById("tab-sugerido");
      const tabManual = document.getElementById("tab-manual");
      const formSugerido = document.getElementById("form-sugerido");
      const formManual = document.getElementById("form-manual");

      if (tab === "sugerido") {
        tabSugerido.classList.add("border-b-2", "border-teal-600", "text-teal-600");
        tabManual.classList.remove("border-b-2", "border-teal-600", "text-teal-600");
        formSugerido.classList.remove("hidden");
        formManual.classList.add("hidden");
      } else {
        tabManual.classList.add("border-b-2", "border-teal-600", "text-teal-600");
        tabSugerido.classList.remove("border-b-2", "border-teal-600", "text-teal-600");
        formManual.classList.remove("hidden");
        formSugerido.classList.add("hidden");
      }
    }

    function criarRoteiroSugerido(e) {
      e.preventDefault();
      const opcao = document.getElementById("sugerido-opcao").value;
      const dataInicio = document.getElementById("sugerido-inicio").value;
      const dataFim = document.getElementById("sugerido-fim").value;

      if (!opcao || !dataInicio || !dataFim) {
        alert("Preencha todos os campos!");
        return;
      }

      const partes = opcao.split('-');
      const continente = partes[0];
      const estacao = partes[1] || "Primavera";

      let titulo = `Viagem para ${continente}`;
      let destino = continente;
      let atividades = [];

      // Itinerário básico por destino
      if (opcao.includes("Europa")) {
        atividades = ["Chegada em Paris", "Torre Eiffel ao pôr do sol", "Museu do Louvre", "Passeio de barco no Sena"];
      } else if (opcao.includes("América do Sul")) {
        atividades = ["Praia de Copacabana", "Cristo Redentor", "Passeio de buggy em Jericoacoara", "Dunas de Lençóis"];
      } else if (opcao.includes("Ásia")) {
        atividades = ["Templos de Quioto", "Hanami (cerejeiras)", "Mercado de Tóquio", "Castelo de Osaka"];
      } else if (opcao.includes("África")) {
        atividades = ["Safari no Maasai Mara", "Lago Nakuru com flamingos", "Reserva de Elefantes", "Cultura Maasai"];
      } else if (opcao.includes("América do Norte")) {
        atividades = ["Lake Louise", "Banff National Park", "Vancouver Downtown", "Columbia Icefield"];
      } else if (opcao.includes("Oceania")) {
        atividades = ["Opera House em Sydney", "Mergulho na Grande Barreira", "Floresta Tropical em Cairns", "Bondi Beach"];
      }

      const novo = {
        id: Date.now(),
        titulo: titulo,
        destino: destino,
        dataInicio: dataInicio,
        dataFim: dataFim,
        tipo: "manual",
        continente: continente,
        estacao: estacao,
        atividades: atividades  
      };

      roteiros.push(novo);
      salvarRoteiros();
      renderDashboard();
      document.getElementById("new-roteiro-modal").classList.add("hidden");
      alert("Roteiro sugerido criado com itinerário básico!");
    }

    function criarRoteiroManual(e) {
      e.preventDefault();
      const novo = {
        id: Date.now(),
        titulo: document.getElementById("man-titulo").value,
        destino: document.getElementById("man-destino").value,
        dataInicio: document.getElementById("man-inicio").value,
        dataFim: document.getElementById("man-fim").value,
        tipo: "manual",
        atividades: []
      };

      roteiros.push(novo);
      salvarRoteiros();
      renderDashboard();
      document.getElementById("new-roteiro-modal").classList.add("hidden");
      alert("Roteiro manual criado!");
    }

    function verRoteiro(id) {
      window.location.href = `roteiro.html?id=${id}`;
    }

    function logout() {
      localStorage.removeItem("roadmap_usuario_logado");
      window.location.href = "index.html";
    }

    window.onload = renderDashboard;
  </script>
</body>
</html>
