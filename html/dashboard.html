<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadMap - Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
    body { font-family: "Inter", sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="gradient-bg text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 py-6 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-map text-3xl"></i>
        <h1 class="text-3xl font-bold">RoadMap</h1>
      </div>
      <button onclick="logout()" class="bg-white/20 hover:bg-white/30 px-5 py-2 rounded-xl flex items-center gap-2">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10">
    <div class="flex justify-between items-center mb-10">
      <h2 class="text-4xl font-bold text-gray-800">Meus Roteiros</h2>
      <button onclick="openNewRoteiroModal()" class="gradient-bg text-white px-6 py-3 rounded-2xl font-semibold flex items-center gap-2">
        <i class="fa-solid fa-plus"></i> Novo Roteiro
      </button>
    </div>

    <div id="roteiros-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- Modal Novo Roteiro -->
  <div id="new-roteiro-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-white rounded-3xl p-8 w-full max-w-lg">
      <h3 class="text-2xl font-bold mb-6">Criar Novo Roteiro</h3>

      <!-- Tabs -->
      <div class="flex border-b mb-6">
        <button onclick="switchTab('smart')" id="tab-smart" 
                class="flex-1 py-3 font-medium border-b-2 border-teal-600 text-teal-600 transition">
          Inteligente (IA)
        </button>
        <button onclick="switchTab('manual')" id="tab-manual" 
                class="flex-1 py-3 font-medium text-gray-500 hover:text-gray-700 transition">
          Manual
        </button>
      </div>

      <!-- Form Inteligente -->
      <form id="form-smart" onsubmit="gerarRoteiroIA(event)" class="space-y-5">
        <div>
          <label class="block text-sm mb-2">Continente</label>
          <select id="smart-continente" required class="w-full p-3 border rounded-2xl">
            <option value="">Selecione...</option>
            <option value="Europa">Europa</option>
            <option value="América do Sul">América do Sul</option>
            <option value="Ásia">Ásia</option>
            <option value="América do Norte">América do Norte</option>
          </select>
        </div>
        <div>
          <label class="block text-sm mb-2">Estação</label>
          <select id="smart-estacao" required class="w-full p-3 border rounded-2xl">
            <option value="">Selecione...</option>
            <option value="Verão">Verão</option>
            <option value="Inverno">Inverno</option>
            <option value="Primavera">Primavera</option>
            <option value="Outono">Outono</option>
          </select>
        </div>
        <button type="submit" class="w-full gradient-bg text-white py-4 rounded-2xl font-bold">Gerar com IA</button>
      </form>

      <!-- Form Manual -->
      <form id="form-manual" onsubmit="criarManual(event)" class="hidden space-y-5">
        <input id="man-titulo" placeholder="Título do Roteiro" required class="w-full p-3 border rounded-2xl">
        <input id="man-destino" placeholder="Destino" required class="w-full p-3 border rounded-2xl">
        <div class="grid grid-cols-2 gap-4">
          <input id="man-inicio" type="date" required class="w-full p-3 border rounded-2xl">
          <input id="man-fim" type="date" required class="w-full p-3 border rounded-2xl">
        </div>
        <button type="submit" class="w-full gradient-bg text-white py-4 rounded-2xl font-bold">Criar Manualmente</button>
      </form>
    </div>
  </div>

  <script>
    let roteiros = JSON.parse(localStorage.getItem("roadmap_roteiros")) || [];

    function salvarRoteiros() {
      localStorage.setItem("roadmap_roteiros", JSON.stringify(roteiros));
    }

    function renderDashboard() {
      const container = document.getElementById("roteiros-container");
      container.innerHTML = roteiros.map(r => `
        <div onclick="verRoteiro(${r.id})" class="bg-white rounded-3xl p-6 border hover:border-teal-300 cursor-pointer">
          <h3 class="font-bold text-xl">${r.titulo}</h3>
          <p class="text-teal-600 mt-1">${r.destino}</p>
          <p class="text-sm text-gray-500 mt-4">${r.dataInicio} — ${r.dataFim}</p>
        </div>
      `).join('');
    }

    function openNewRoteiroModal() {
      document.getElementById("new-roteiro-modal").classList.remove("hidden");
      switchTab('smart'); // Garante que inicia na aba Inteligente
    }

    function switchTab(tab) {
      const tabSmart = document.getElementById("tab-smart");
      const tabManual = document.getElementById("tab-manual");
      const formSmart = document.getElementById("form-smart");
      const formManual = document.getElementById("form-manual");

      if (tab === "smart") {
        tabSmart.classList.add("border-b-2", "border-teal-600", "text-teal-600");
        tabManual.classList.remove("border-b-2", "border-teal-600", "text-teal-600");
        formSmart.classList.remove("hidden");
        formManual.classList.add("hidden");
      } else {
        tabManual.classList.add("border-b-2", "border-teal-600", "text-teal-600");
        tabSmart.classList.remove("border-b-2", "border-teal-600", "text-teal-600");
        formManual.classList.remove("hidden");
        formSmart.classList.add("hidden");
      }
    }

    // Funções de criação (simplificadas por enquanto)
    function gerarRoteiroIA(e) {
      e.preventDefault();
      alert("Funcionalidade IA em desenvolvimento");
      // Aqui você pode colocar a chamada real à Gemini
    }

    function criarManual(e) {
      e.preventDefault();
      const novo = {
        id: Date.now(),
        titulo: document.getElementById("man-titulo").value,
        destino: document.getElementById("man-destino").value,
        dataInicio: document.getElementById("man-inicio").value,
        dataFim: document.getElementById("man-fim").value,
        tipo: "manual"
      };
      roteiros.push(novo);
      salvarRoteiros();
      renderDashboard();
      document.getElementById("new-roteiro-modal").classList.add("hidden");
    }

    function verRoteiro(id) {
      window.location.href = `roteiro.html?id=${id}`;
    }

    function logout() {
      localStorage.removeItem("roadmap_usuario_logado");
      window.location.href = "index.html";
    }

    // Inicializar
    window.onload = renderDashboard;
  </script>
</body>
</html>
