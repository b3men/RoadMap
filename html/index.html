<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoadMap - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
    body { font-family: "Inter", sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #0f766e 0%, #14b8a6 100%); }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">

  <div class="max-w-md w-full mx-4">
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
      <!-- Header -->
      <div class="gradient-bg text-white p-10 text-center">
        <i class="fa-solid fa-map text-5xl mb-4"></i>
        <h1 class="text-4xl font-bold">RoadMap</h1>
        <p class="mt-2 opacity-90">Roteiros de Viagem Personalizados</p>
      </div>

      <div class="p-8">
        <!-- Tabs Login / Cadastro -->
        <div class="flex border-b mb-8">
          <button onclick="showLogin()" id="btn-login" 
                  class="flex-1 py-3 font-medium border-b-2 border-teal-600 text-teal-600">
            Entrar
          </button>
          <button onclick="showRegister()" id="btn-register" 
                  class="flex-1 py-3 font-medium text-gray-500 hover:text-gray-700">
            Criar Conta
          </button>
        </div>

        <!-- Login Form -->
        <div id="login-form">
          <div class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">E-mail</label>
              <input id="login-email" type="email" placeholder="seu@email.com" 
                     class="w-full px-4 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-teal-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
              <input id="login-password" type="password" placeholder="••••••••" 
                     class="w-full px-4 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-teal-500">
            </div>
            <button onclick="fazerLogin()" 
                    class="w-full bg-teal-600 hover:bg-teal-700 text-white py-4 rounded-2xl font-semibold text-lg transition">
              Entrar
            </button>
          </div>
        </div>

        <!-- Cadastro Form -->
        <div id="register-form" class="hidden">
          <div class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Nome Completo</label>
              <input id="reg-nome" type="text" placeholder="ex: João da Silva" 
                     class="w-full px-4 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-teal-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">E-mail</label>
              <input id="reg-email" type="email" placeholder="seu@email.com" 
                     class="w-full px-4 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-teal-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
              <input id="reg-password" type="password" placeholder="Crie uma senha" 
                     class="w-full px-4 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-teal-500">
            </div>
            <button onclick="cadastrarUsuario()" 
                    class="w-full bg-teal-600 hover:bg-teal-700 text-white py-4 rounded-2xl font-semibold text-lg transition">
              Criar Minha Conta
            </button>
          </div>
        </div>
      </div>
    </div>

    <p class="text-center text-gray-500 text-sm mt-6">
      Protótipo - Disciplina Desenvolvimento de Protótipo
    </p>
  </div>

  <script>
    let usuarios = JSON.parse(localStorage.getItem("roadmap_usuarios")) || [];

    // Usuário de teste inicial
    /*if (usuarios.length === 0) {
      usuarios.push({
        id: 1,
        nome: "Beatriz Mendonça",
        email: "beatriz@unibave.edu.br",
        senha: "123456"
      });
      localStorage.setItem("roadmap_usuarios", JSON.stringify(usuarios));
    }*/

    function showLogin() {
      document.getElementById("login-form").classList.remove("hidden");
      document.getElementById("register-form").classList.add("hidden");
      document.getElementById("btn-login").classList.add("border-b-2", "border-teal-600", "text-teal-600");
      document.getElementById("btn-register").classList.remove("border-b-2", "border-teal-600", "text-teal-600");
    }

    function showRegister() {
      document.getElementById("login-form").classList.add("hidden");
      document.getElementById("register-form").classList.remove("hidden");
      document.getElementById("btn-register").classList.add("border-b-2", "border-teal-600", "text-teal-600");
      document.getElementById("btn-login").classList.remove("border-b-2", "border-teal-600", "text-teal-600");
    }

    function fazerLogin() {
      const email = document.getElementById("login-email").value.trim();
      const senha = document.getElementById("login-password").value.trim();

      const usuario = usuarios.find(u => u.email === email && u.senha === senha);

      if (usuario) {
        localStorage.setItem("roadmap_usuario_logado", JSON.stringify(usuario));
        alert(`Bem-vindo(a), ${usuario.nome}!`);
        window.location.href = "dashboard.html";
      } else {
        alert("E-mail ou senha incorretos!");
      }
    }

    function cadastrarUsuario() {
      const nome = document.getElementById("reg-nome").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const senha = document.getElementById("reg-password").value.trim();

      if (!nome || !email || !senha) {
        alert("Preencha todos os campos!");
        return;
      }

      if (usuarios.some(u => u.email === email)) {
        alert("Este e-mail já está cadastrado!");
        return;
      }

      const novoUsuario = { id: Date.now(), nome, email, senha };
      usuarios.push(novoUsuario);
      localStorage.setItem("roadmap_usuarios", JSON.stringify(usuarios));

      alert("Cadastro realizado com sucesso!");
      showLogin();
    }
  </script>
</body>
</html>
